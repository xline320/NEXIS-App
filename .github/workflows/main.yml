name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Force Clean Build APK
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.run.in.process=true -Dorg.gradle.daemon=false"
      run: |
        chmod +x ./gradlew || true
        ./gradlew clean assembleDebug --stacktrace --continue || ./gradlew assembleDebug --continue

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gradle-build-logs
        path: "**/build/reports/"
        
