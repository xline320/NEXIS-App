name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project Zip if present
      run: |
        if [ -f "nexis.zip" ]; then
          unzip -o nexis.zip -d extracted/
          cp -rn extracted/* . 2>/dev/null || true
          cp -rn extracted/.* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant Gradle Execution
      run: |
        chmod +x gradlew || true
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build Debug APK
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dksp.run.in.process=true -Dksp.incremental=false"
        GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.run.in.process=true -Dksp.incremental=false -Dorg.gradle.daemon=false"
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
        
