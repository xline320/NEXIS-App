name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract nexis.zip
      run: |
        if [ -f "nexis.zip" ]; then
          echo "Extracting nexis.zip..."
          unzip -o nexis.zip -d extracted_project
          # Move all extracted files to root directory if they were inside a subfolder
          if [ -d extracted_project ]; then
            cp -r extracted_project/* . 2>/dev/null || true
            cp -r extracted_project/.* . 2>/dev/null || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK
      run: |
        GRADLE_CMD=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLE_CMD" ]; then
          DIR=$(dirname "$GRADLE_CMD")
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
        
