name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Create Dummy Files
      run: |
        keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        find . -type d -exec cp debug.keystore {}/ \; 2>/dev/null || true

        DUMMY_JSON='{"project_info":{"project_number":"123456789","project_id":"dummy-app","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.example.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}'
        find . -name "src" -type d | while read dir; do
          mkdir -p "$dir/../"
          echo "$DUMMY_JSON" > "$dir/../google-services.json"
        done

    - name: Build APK Direct Command
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.run.in.process=true -Dorg.gradle.daemon=false"
      run: |
        gradle assembleDebug --no-daemon --continue || ./gradlew assembleDebug --no-daemon --continue

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
        
